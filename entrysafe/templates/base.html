{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}"{% if user.is_authenticated %} data-auth{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EntrySafe{% endblock %}</title>
  <script>
    /* Pick the theme before first paint: the account's saved choice (set by the server),
       otherwise the last choice on this device, otherwise light. */
    (function () {
      var d = document.documentElement, t = d.getAttribute('data-theme');
      try {
        if (t && d.hasAttribute('data-auth')) localStorage.setItem('es-theme', t);
        if (!t) t = localStorage.getItem('es-theme');
      } catch (e) {}
      if (t !== 'dark') t = 'light'; /* light unless the user chose dark */
      d.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/entrysafe-ui.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  {% include "partials/_icons.html" %}
  {% block body %}{% endblock %}
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{% static 'js/ui/core.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
